apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vllm-agent
  name: vllm-agent
  namespace: vetobench
spec:
  progressDeadlineSeconds: 3600   # first start of a large model downloads its weights (startup probe allows 60 min)
  replicas: 1
  selector:
    matchLabels:
      app: vllm-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm-agent
    spec:
      containers:
      - args:
        - exec vllm serve "$MODEL_ID" --served-model-name "$SERVED_NAME" --host 0.0.0.0 --port 8000 --api-key "$VLLM_API_KEY" --enable-auto-tool-choice --tool-call-parser "$TOOL_PARSER" --max-model-len
          32768 --gpu-memory-utilization 0.92 --dtype bfloat16 $EXTRA_ARGS
        command:
        - /bin/sh
        - -c
        env:
        - name: MODEL_ID
          value: Qwen/Qwen3-8B
        - name: SERVED_NAME
          value: qwen3-8b-test
        - name: TOOL_PARSER
          value: hermes
        - name: EXTRA_ARGS    # extra vllm serve flags per model, set by scripts/swap-agent-model.sh
          value: ''
        - name: HOME
          value: /models
        - name: HF_HOME
          value: /models/hf
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              key: HF_TOKEN
              name: vllm-secrets
              optional: true
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              key: VLLM_API_KEY
              name: vllm-secrets
        image: docker.io/vllm/vllm-openai:latest
        imagePullPolicy: Always
        name: vllm
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '12'
            memory: 64Gi
            nvidia.com/gpu: '1'
          requests:
            cpu: '4'
            memory: 32Gi
            nvidia.com/gpu: '1'
        startupProbe:
          failureThreshold: 180
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /models
          name: models
        - mountPath: /dev/shm
          name: shm
      dnsPolicy: ClusterFirst
      enableServiceLinks: false   # avoids vLLM's 'Unknown vLLM environment variable VLLM_AGENT_*' warnings
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: model-cache
      - emptyDir:
          medium: Memory
          sizeLimit: 16Gi
        name: shm

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-agent
  namespace: vetobench
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: vllm-agent
  type: ClusterIP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
    haproxy.router.openshift.io/timeout: 15m
  name: vllm-agent
  namespace: vetobench
spec:
  host: vllm-agent-vetobench.apps.venice.narlabs.io
  port:
    targetPort: http
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: vllm-agent
    weight: 100

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: vetobench
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 300Gi
  storageClassName: lvms-vg1

