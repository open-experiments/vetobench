[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vetobench"
version = "0.1.0"
description = "Measure how much an SLM tool-call judge reduces unsafe agent actions on Agent-SafetyBench and ASB."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6",
    "openai>=1.30",
    "docstring_parser>=0.16",  # needed by some Agent-SafetyBench environments
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
vetobench = "vetobench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vetobench = ["judges/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
